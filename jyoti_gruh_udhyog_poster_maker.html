<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jyoti Gruh Udhyog – Poster Maker</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f1ed;color:#21150d}
.header{background:#17110d;color:#d9b36a;padding:16px;text-align:center;font-weight:800;letter-spacing:1.5px}
.wrap{max-width:1100px;margin:auto;padding:16px;display:grid;grid-template-columns:360px 1fr;gap:20px}
.panel{background:#fff;border-radius:18px;padding:18px;box-shadow:0 8px 30px #0001}
label{display:block;font-weight:700;margin:12px 0 6px}
input,select,button{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font-size:15px}
button{cursor:pointer;border:0;font-weight:800}
.gold{background:#b78a3b;color:white}
.dark{background:#21150d;color:white}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.preview-area{display:flex;align-items:center;justify-content:center;min-height:600px;background:#ddd8d0;border-radius:18px;padding:20px}
#canvas{width:min(100%,620px);height:auto;aspect-ratio:1/1;box-shadow:0 12px 35px #0003;background:#20150f}
.small{font-size:12px;color:#777;margin-top:6px}
@media(max-width:800px){.wrap{grid-template-columns:1fr}.preview-area{min-height:auto;padding:10px}}
</style>
</head>
<body>
<div class="header">JYOTI GRUH UDHYOG • PREMIUM POSTER MAKER</div>

<div class="wrap">
<div class="panel">
<label>Product Photo</label>
<input id="photo" type="file" accept="image/*">

<label>Product Name</label>
<input id="name" value="Naylon Plain Khakhra" placeholder="Product name">

<div class="row">
<div><label>Weight</label><input id="weight" value="500 Gm"></div>
<div><label>Price</label><input id="price" value="₹160"></div>
</div>

<label>Template</label>
<select id="template">
<option value="classic">Classic Gold</option>
<option value="luxury">Luxury Frame</option>
<option value="clean">Clean Premium</option>
</select>

<label>Logo / Brand Text</label>
<input id="brand" value="JYOTI GRUH UDHYOG">

<label>WEBP Quality</label>
<input id="quality" type="range" min="0.5" max="1" step="0.05" value="0.85">
<div class="small">Higher quality = larger file size</div>

<br>
<button class="gold" onclick="downloadWebp()">DOWNLOAD WEBP</button>
<br><br>
<button class="dark" onclick="resetAll()">RESET</button>
</div>

<div class="preview-area">
<canvas id="canvas" width="1024" height="1024"></canvas>
</div>
</div>

<script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
let img=null;

function draw(){
 const name=document.getElementById('name').value||'Product Name';
 const weight=document.getElementById('weight').value||'';
 const price=document.getElementById('price').value||'';
 const brand=document.getElementById('brand').value||'JYOTI GRUH UDHYOG';
 const t=document.getElementById('template').value;

 let g=ctx.createLinearGradient(0,0,1024,1024);
 g.addColorStop(0,'#100b08');g.addColorStop(.5,'#2a1a10');g.addColorStop(1,'#0d0907');
 ctx.fillStyle=g;ctx.fillRect(0,0,1024,1024);

 if(t==='clean'){
   ctx.fillStyle='#fff';ctx.fillRect(35,35,954,954);
   ctx.strokeStyle='#b78a3b';ctx.lineWidth=5;ctx.strokeRect(55,55,914,914);
 }else{
   ctx.strokeStyle='#c99b4d';ctx.lineWidth=8;ctx.strokeRect(34,34,956,956);
   ctx.strokeStyle='#80602d';ctx.lineWidth=2;ctx.strokeRect(52,52,920,920);
 }

 ctx.textAlign='center';
 ctx.fillStyle=t==='clean'?'#8c6427':'#d9b36a';
 ctx.font='bold 42px Georgia';
 ctx.fillText(brand.toUpperCase(),512,115);

 // photo area
 const box={x:110,y:165,w:804,h:535};
 ctx.save();
 if(t!=='clean'){
   ctx.strokeStyle='#8f6b36';ctx.lineWidth=3;ctx.strokeRect(box.x,box.y,box.w,box.h);
 }
 if(img){
   const r=Math.min(box.w/img.width,box.h/img.height);
   const w=img.width*r,h=img.height*r;
   ctx.drawImage(img,box.x+(box.w-w)/2,box.y+(box.h-h)/2,w,h);
 }else{
   ctx.fillStyle=t==='clean'?'#f2eee8':'#3a281a';
   ctx.fillRect(box.x,box.y,box.w,box.h);
   ctx.fillStyle='#a8895d';ctx.font='bold 34px Arial';
   ctx.fillText('UPLOAD PRODUCT PHOTO',512,445);
 }
 ctx.restore();

 ctx.fillStyle=t==='clean'?'#21150d':'#f6e7c5';
 ctx.font='bold 54px Georgia';
 wrapText(name,512,790,820,60);

 ctx.fillStyle='#c99b4d';
 ctx.font='bold 34px Arial';
 ctx.fillText(weight,370,885);
 ctx.fillText(price,670,885);

 ctx.fillStyle=t==='clean'?'#6b4a20':'#d9b36a';
 ctx.font='bold 25px Arial';
 ctx.fillText('PREMIUM QUALITY • TRADITIONAL TASTE',512,945);
}

function wrapText(text,x,y,maxWidth,lineHeight){
 let words=text.split(' '),line='';
 for(let n=0;n<words.length;n++){
   let test=line+words[n]+' ';
   if(ctx.measureText(test).width>maxWidth && n>0){
     ctx.fillText(line,x,y);line=words[n]+' ';y+=lineHeight;
   }else line=test;
 }
 ctx.fillText(line,x,y);
}

document.querySelectorAll('input,select').forEach(e=>e.addEventListener('input',draw));
document.getElementById('photo').addEventListener('change',e=>{
 const f=e.target.files[0]; if(!f)return;
 const reader=new FileReader();
 reader.onload=ev=>{img=new Image();img.onload=draw;img.src=ev.target.result};
 reader.readAsDataURL(f);
});

function downloadWebp(){
 draw();
 const q=parseFloat(document.getElementById('quality').value);
 canvas.toBlob(blob=>{
   const a=document.createElement('a');
   a.href=URL.createObjectURL(blob);
   const n=(document.getElementById('name').value||'jyoti-gruh-udhyog').replace(/[^a-z0-9]+/gi,'-').toLowerCase();
   a.download=n+'.webp';a.click();
   setTimeout(()=>URL.revokeObjectURL(a.href),1000);
 },'image/webp',q);
}

function resetAll(){
 document.getElementById('name').value='Naylon Plain Khakhra';
 document.getElementById('weight').value='500 Gm';
 document.getElementById('price').value='₹160';
 document.getElementById('brand').value='JYOTI GRUH UDHYOG';
 document.getElementById('template').value='classic';
 document.getElementById('photo').value='';
 img=null;draw();
}
draw();
</script>
</body>
</html>
