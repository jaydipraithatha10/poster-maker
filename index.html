<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jyoti Gruh Udhyog Poster Maker</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090705;color:#f4dfb0;font-family:Georgia,serif}
header{text-align:center;padding:18px;background:#0b0806;border-bottom:1px solid #8c6115}
header b{font-size:25px;color:#e9ad27} header small{display:block;letter-spacing:2px;margin-top:5px;color:#c7ad7b}
.wrap{max-width:1100px;margin:auto;padding:14px;display:grid;grid-template-columns:340px 1fr;gap:16px}
.panel{background:#100b07;border:1px solid #704c12;border-radius:16px;padding:16px}
h2{font-size:17px;color:#e7a91e;margin:5px 0 14px}
label{display:block;font-size:12px;margin:12px 0 6px;color:#cdb889}
input{width:100%;padding:12px;border-radius:9px;border:1px solid #624719;background:#0b0907;color:#f8e7c0;font-size:15px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{width:100%;padding:13px;border-radius:10px;font-weight:800;border:1px solid #8f6417;cursor:pointer}
.gold{background:linear-gradient(#e9b130,#9a6208);color:#160d03}.dark{background:#19110b;color:#e8c982}
.upload{padding:18px;border:1px dashed #c99521;border-radius:10px;text-align:center;cursor:pointer}
#canvas{width:min(100%,700px);height:auto;border:1px solid #8c6417;box-shadow:0 15px 50px #000}
.preview{display:flex;justify-content:center}.note{font:12px Arial;color:#9f8e70;line-height:1.5;margin-top:8px}
.status{font:12px Arial;color:#e2b33d;margin:9px 0;min-height:16px}
@media(max-width:800px){.wrap{grid-template-columns:1fr}.preview{order:-1}}
</style>
</head>
<body>
<header><b>🪔 Jyoti Gruh Udhyog</b><small>PREMIUM POSTER MAKER</small></header>
<div class="wrap">
<section class="panel">
<h2>1. PRODUCT IMAGE</h2>
<label class="upload">📷 Upload Product Image
<input id="photo" type="file" accept="image/*" hidden></label>
<div class="note">તમારી product image આપો. Posterમાં એ જ image ઉપયોગ થશે.</div>

<h2>2. DETAILS</h2>
<label>PRODUCT NAME *</label>
<input id="name" value="RATLAMI SEV">
<div class="row">
<div><label>WEIGHT — OPTIONAL</label><input id="weight" placeholder="200 Gm"></div>
<div><label>PRICE — OPTIONAL</label><input id="price" placeholder="Rs 80"></div>
</div>

<h2>3. GENERATE</h2>
<button class="gold" id="make">✨ CREATE WEBP POSTER</button>
<div class="status" id="status"></div>
<button class="dark" id="download">⬇ DOWNLOAD WEBP</button>
<div class="note">1024×1024. Price empty હશે તો price badge દેખાશે નહીં. WEBP size 40–50 KB target રાખવાનો પ્રયાસ થશે.</div>
</section>
<section class="preview"><canvas id="canvas" width="1024" height="1024"></canvas></section>
</div>

<script>
const c=document.getElementById('canvas'),x=c.getContext('2d');let img=null;
const $=id=>document.getElementById(id);

function fit(im,X,Y,W,H){
 const r=Math.max(W/im.width,H/im.height),w=im.width*r,h=im.height*r;
 x.drawImage(im,X+(W-w)/2,Y+(H-h)/2,w,h);
}
function draw(){
 x.fillStyle='#050403';x.fillRect(0,0,1024,1024);
 // gold ornate-style border
 x.strokeStyle='#d49b1d';x.lineWidth=5;x.strokeRect(16,16,992,992);
 x.strokeStyle='#6e4a12';x.lineWidth=2;x.strokeRect(30,30,964,964);
 // top brand
 x.textAlign='center';x.fillStyle='#edb534';x.font='bold 48px Georgia';x.fillText('Jyoti',512,98);
 x.font='bold 24px Georgia';x.fillText('Gruh Udhyog',512,130);
 x.fillStyle='#eee1c5';x.font='19px Georgia';x.fillText('• RAJKOT • GUJARAT •',512,166);
 x.font='17px Georgia';x.fillText('✦  TRADITIONAL TASTE, MADE WITH LOVE  ✦',512,198);

 // left premium feature rail
 const b=[['◉','100%','NATURAL'],['✓','PREMIUM','QUALITY'],['✦','FINE','GRAINS'],['◇','NO ADDED','PRESERVATIVES'],['♡','MADE WITH','LOVE & CARE']];
 b.forEach((v,i)=>{let y=270+i*135;x.strokeStyle='#d09a1c';x.lineWidth=2;x.beginPath();x.arc(92,y-18,36,0,7);x.stroke();x.fillStyle='#edb02b';x.font='bold 25px Georgia';x.fillText(v[0],92,y-9);x.fillStyle='#eee1c5';x.font='bold 15px Georgia';x.fillText(v[1],92,y+44);x.fillText(v[2],92,y+63)});

 // title plaque
 x.strokeStyle='#d49b1d';x.lineWidth=4;x.strokeRect(250,260,690,170);
 let name=($('name').value||'PRODUCT NAME').toUpperCase();
 x.fillStyle='#f6d88f';x.font=name.length>17?'bold 48px Georgia':'bold 60px Georgia';
 x.fillText(name,595,360);
 x.fillStyle='#d29a1e';x.fillRect(350,405,490,54);
 x.fillStyle='#1a0e04';x.font='bold 23px Georgia';x.fillText('CRISPY  •  TASTY  •  PREMIUM',595,440);

 // image area
 x.save();x.beginPath();x.rect(250,475,690,440);x.clip();
 if(img) fit(img,250,475,690,440);
 else {x.fillStyle='#1b1008';x.fillRect(250,475,690,440);x.fillStyle='#b68a39';x.font='22px Arial';x.fillText('UPLOAD PRODUCT IMAGE',595,700)}
 x.restore();

 // optional price badge
 let price=$('price').value.trim();
 if(price){
   x.fillStyle='#090604';x.strokeStyle='#dca522';x.lineWidth=4;x.beginPath();x.arc(860,825,82,0,7);x.fill();x.stroke();
   x.fillStyle='#e8b63f';x.font='bold 18px Georgia';x.fillText('PRICE',860,798);
   x.font='bold 38px Georgia';x.fillText(price,860,850);
 }
 let weight=$('weight').value.trim();
 if(weight){x.fillStyle='#e7b33d';x.font='bold 22px Georgia';x.fillText(weight,595,950)}
 x.fillStyle='#e5d7ba';x.font='17px Georgia';x.fillText('RAJKOT, GUJARAT  |  +91 9712149344  |  ORDER ON WHATSAPP',512,986);
}
$('photo').addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{img=new Image();img.onload=draw;img.src=r.result};r.readAsDataURL(f)});
document.querySelectorAll('input').forEach(el=>el.addEventListener('input',draw));
$('make').onclick=()=>{draw();$('status').textContent='Poster ready ✓'};
async function makeBlob(target=50000){
 return new Promise(resolve=>{let lo=.25,hi=.95,best=null;
 function test(){let q=(lo+hi)/2;c.toBlob(b=>{if(!b)return resolve(best);if(b.size<=target){best=b;lo=q}else hi=q;if(hi-lo<.01||best)resolve(best||b);else test()},'image/webp',q)}
 test()})
}
$('download').onclick=async()=>{
 draw();$('status').textContent='Optimizing WEBP…';
 let b=await makeBlob(50000);
 if(b.size>55000){b=await new Promise(r=>c.toBlob(r,'image/webp',.55))}
 let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=(($('name').value||'jyoti-poster').replace(/[^a-z0-9]+/gi,'-').toLowerCase())+'.webp';a.click();
 $('status').textContent=`Downloaded ✓  ${(b.size/1024).toFixed(1)} KB`;
};
draw();
</script>
</body>
</html>
